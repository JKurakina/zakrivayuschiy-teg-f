<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Закрывающий тег</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
  </head>
  <body class="page">
    <header class="header">
      <div class="header__inner box">
        <p class="header__logo">&lt;/html&gt;</p>
        <p class="header__subtitle">закрывающий тег</p>
      </div>
    </header>
    <main class="content">
      <div class="cards">
        <article class="card box">
          <h2 class="card__title">Фритрек и нулевой спринт: Подготовка к работе</h2>
          <div class="card__media">
            <img class="card__image" src="./images/cards/start.jpg" alt="Мягкий вечерний свет у окна" loading="lazy" />
            <span class="card__label">старт</span>
          </div>
          <div class="card__body">
            <p>Это было самое начало пути. На этом этапе важно было проникнуться основами и настроиться на учёбу. И, возможно, подумать, как новые знания могут повлиять на ваше будущее.</p>
            <p>Место для ваших воспоминаний о начале обучения.</p>
            <div class="card__actions">
              <button class="card__icon-button" type="button" aria-label="Поставить лайк">
                <svg class="like-icon" xmlns="http://www.w3.org/2000/svg" width="39" height="36" fill="none" viewBox="0 0 39 36">
  <g class="heart">
    <path class="contour" fill="var(--heart-contour-color)" d="M12 6H9v3h3zm3 0h-3v3h3zM9 9H6v3h3zm0 3H6v3h3zm0 3H6v3h3zm9-9h-3v3h3zm-6 12H9v3h3zm3 3h-3v3h3zm3 3h-3v3h3zm9-18h3v3h-3zm-3 0h3v3h-3zm6 3h3v3h-3zm0 3h3v3h-3zm0 3h3v3h-3zm-9-9h3v3h-3zm6 12h3v3h-3zm-3 3h3v3h-3zm-3 3h3v3h-3zm0 3h-3v3h3zm0-18h-3v3h3z"/>
    <path class="main-body" fill="transparent" d="M12 9H9v3h3zm3 3h-3v3h3zm3-3h-3v3h3zm-6 6H9v3h3zm3 0h-3v3h3zm0 3h-3v3h3zm3-6h-3v3h3zm0 9h-3v3h3zm0-3h-3v3h3zm9-9h3v3h-3zm-3 0h3v3h-3zm3 3h3v3h-3zm-3 0h3v3h-3zm-3-3h3v3h-3zm6 6h3v3h-3zm-3 0h3v3h-3zm0 3h3v3h-3zm-3-6h3v3h-3zm0 9h3v3h-3zm0-3h3v3h-3zm0 3h-3v3h3zm0 3h-3v3h3z"/>
    <path class="core" fill="transparent" d="M18 15h-3v3h3zm3 0h3v3h-3zm0 0h-3v3h3zm0-3h-3v3h3zm0 6h-3v3h3z"/>
  </g>
  <path class="sparks" fill="var(--heart-sparks-color)" d="M36 13h3v3h-3zm-9 14h3v3h-3zm-9 6h3v3h-3zm-9-6h3v3H9zM24 0h3v3h-3zm9 3h3v3h-3zM3 3h3v3H3zm9-3h3v3h-3zM0 13h3v3H0z"/>
</svg>
              </button>
              <button class="card__like-button button" type="button">
                <span class="button__text">Like</span>
              </button>
            </div>
          </div>
        </article>
      </div>
    </main>
    <script src="./scripts/like.js"></script>
  </body>
</html>
